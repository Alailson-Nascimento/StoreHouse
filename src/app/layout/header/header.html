<header class="topo">
  <a routerLink="/" class="logo">StoreHouse</a>

  <button class="botao-menu" (click)="alternarMenu()" aria-label="Abrir menu">☰</button>

  @if (menuAberto()) {
    <button class="backdrop" (click)="fecharMenu()" aria-label="Fechar menu"></button>
  }
  <nav class="menu" [class.aberto]="menuAberto()">
    <a routerLink="/produtos" routerLinkActive="ativo" (click)="fecharMenu()">Produtos</a>
    <a routerLink="/admin" routerLinkActive="ativo" (click)="fecharMenu()">Admin</a>

    <a routerLink="/carrinho" routerLinkActive="ativo" class="link-carrinho" (click)="fecharMenu()">
      🛒 Carrinho
      @if (totalItens() > 0) {
        <span class="badge">{{ totalItens() }}</span>
      }
    </a>
  </nav>
</header>
