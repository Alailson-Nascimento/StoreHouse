<mat-form-field appearance="outline" class="campo-pesquisa">
  <mat-label>Procurar Jogos</mat-label>
  <input matInput [(ngModel)]="pesquisaDigitada" placeholder="Ex: God of War" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div class="grid-produtos">
  @for (produto of produtosFiltrados(); track produto.id) {
    <app-produto-card
      [produto]="produto"
      (adicionarAoCarrinho)="aoAdicionarCarrinho($event)"
      (avisarQuandoDisponivel)="aoAvisarQuandoDisponivel($event)"
    >
    </app-produto-card>
  } @empty {
    <p>Nenhum jogo encontrado.</p>
  }
</div>
