<div class="card-produto">
  <img [src]="produto().imagem" [alt]="produto().nome" />
  <h3>{{ produto().nome }}</h3>
  <p>{{ produto().descricao }}</p>
  <p class="preco">R$ {{ produto().preco.toFixed(2) }}</p>

  @if (produto().estoque > 0) {
    <p class="disponivel">Disponível ({{ produto().estoque }} unid.)</p>
    <button (click)="aoClicarAdicionar()">Adicionar ao Carrinho</button>
  } @else {
    <p class="esgotado">Esgotado</p>
    <button disabled>Indisponível</button>
  }

  <a [routerLink]="['/produtos', produto().id]" class="ver-detalhes">Ver detalhes</a>
</div>
